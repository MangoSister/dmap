# T8: the path tracer over the displaced scenes. S6 lit by its two displaced
# emitters alone, S4 with its displaced emitter, mesh lamp and sky, S7 the
# sci-fi station around the bunny with a distant sun.
include = [
  "../scenes/s6_scifi.toml",
  "../scenes/s4_mixed.toml",
  "../scenes/s7_orbit.toml",
]

[[task]]
type = "path_trace"
scene = "scene.s6"
bounces = 4
render_width = 400
render_height = 300
spp = 64
spp_prog_interval = 32
rng_seed = 7
tone_mapper = { type = "aces", exposure = 1.0 }

[[task]]
type = "path_trace"
scene = "scene.s4"
bounces = 4
render_width = 400
render_height = 300
spp = 64
spp_prog_interval = 32
rng_seed = 7
tone_mapper = { type = "aces", exposure = 1.0 }

[[task]]
type = "path_trace"
scene = "scene.s7"
bounces = 4
render_width = 400
render_height = 300
spp = 256
spp_prog_interval = 64
rng_seed = 7
tone_mapper = { type = "aces", exposure = 1.0 }
