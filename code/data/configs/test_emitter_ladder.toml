# T9: the emitter sampling ladder in scenes (test_emitter_ladder.cpp). S6,
# two displaced panels of two base triangles each and no other light; S7,
# the station torus of 4,608 emitting base triangles and the sun. Direct
# lighting at 200 x 150; the reference is MIS with the scene's own kind.
# The unbiasedness gate judges next-event estimation alone at spp_gate on
# the receivers at least gate_distance from every emitter's box, since it
# converges from below where an emitter lights a receiver at close range.
# FLIP afterwards: python code/python/poc/experiments/flip_t9.py <task dir>.
include = [
  "../scenes/s6_scifi.toml",
  "../scenes/s7_orbit.toml",
]

[[task]]
type = "test_emitter_ladder"
scene = "scene.s6"
spp_ladder = 64
spp_ref = 4096
spp_gate = 2048
gate_distance = 0.25
tolerance = 0.02
strategies = ["nee", "mis"]
uniform = true
bounces = 1
render_width = 200
render_height = 150
spp = 64
rng_seed = 7
tone_mapper = { type = "aces", exposure = 1.0 }

[[task]]
type = "test_emitter_ladder"
