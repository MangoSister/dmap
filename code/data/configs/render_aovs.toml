# T6 verification: primary-ray AOVs of every scene through ks's scene with
# the displaced surfaces as user geometry, against the same scene with
# texel-aligned pre-tessellated substitutes. The subdivision per texel is
# what the substitute's face count allows.
include = [
  "../scenes/s1_triangle.toml",
  "../scenes/s2_torus_rock.toml",
  "../scenes/s3_spot_cobble.toml",
  "../scenes/s4_mixed.toml",
  "../scenes/s5_blender.toml",
]

[[task]]
type = "render_aovs"
scene = "scene.s1"
width = 320
height = 240
substitute_subdivision = 4

